# Dependabot: dependency and Actions updates, weekly, grouped. Added 2026-09-08
# with the security-hardening program (see the repo's security.yml). Version
# updates target `dev` (not the GitHub default `prod`). Merge green low-risk
# PRs to `dev`, then promote `dev` → `test` → `prod`. Security-alert PRs still
# open against `prod`; retarget or cherry-pick onto `dev` — do not merge them
# into prod first unless the operator authorizes a hotfix.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
